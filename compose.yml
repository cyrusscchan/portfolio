services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
